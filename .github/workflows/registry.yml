name: Freeze requested apps

# Starts when a request file is pushed to mpships2. It never needs to exist on main.
on:
  push:
    branches: [mpships2] # change to main later, together with BASE_BRANCH below
    paths:
      - "registry/*/registry.yaml"

permissions:
  contents: write
  pull-requests: write

env:
  BASE_BRANCH: mpships2 # where this runs and where the pull request goes
  SOURCE_BRANCH: main # the app's own repo: the requested commit must be on this branch
  ALLOW_PREFIX: https://github.com/

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the range of commits in this push is needed

      - name: Freeze the commits named in the changed request files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          content_hash() { # one hash over every file's path and bytes
            (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1)
          }

          freeze() { # NAME REPO SHA -- request files are untrusted input, so everything is checked
            local name="$1" repo="$2" sha="$3" tmp
            [[ "$name" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo "refused: app name '$name' must be lowercase letters, digits, - or _"; return 1; }
            [[ "$repo" == "$ALLOW_PREFIX"* ]] || { echo "refused: repository must start with $ALLOW_PREFIX"; return 1; }
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "refused: $name needs the full 40-character commit SHA"; return 1; }
            tmp="$(mktemp -d)"
            git init -q "$tmp"
            git -C "$tmp" remote add origin "$repo"
            git -C "$tmp" fetch -q origin "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
            git -C "$tmp" cat-file -e "$sha^{commit}" 2>/dev/null || { echo "refused: $name commit ${sha:0:8} is not in the history of $SOURCE_BRANCH"; return 1; }
            git -C "$tmp" merge-base --is-ancestor "$sha" "origin/$SOURCE_BRANCH" || { echo "refused: $name commit ${sha:0:8} is not on $SOURCE_BRANCH"; return 1; }
            rm -rf "apps/$name"
            mkdir -p "apps/$name"
            git -C "$tmp" archive "$sha" | tar -x -C "apps/$name"
            [ -f registered.yaml ] || echo "apps: {}" > registered.yaml
            NAME="$name" REPO="$repo" SHA="$sha" HASH="$(content_hash "apps/$name")" NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              yq -i '.apps[strenv(NAME)] = {"repo": strenv(REPO), "branch": strenv(SOURCE_BRANCH), "sha": strenv(SHA), "content_sha256": strenv(HASH), "frozen_at": strenv(NOW)}' registered.yaml
            echo "frozen $name at ${sha:0:8}"
          }

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git hash-object -t tree /dev/null)" # a brand new branch: compare with the empty tree
          fi
          files="$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'registry/*/registry.yaml')"
          if [ -z "$files" ]; then
            echo "no request files changed in this push"
            exit 0
          fi
          while IFS= read -r file; do
            freeze "$(basename "$(dirname "$file")")" "$(yq '.repo' "$file")" "$(yq '.sha' "$file")"
          done <<< "$files"

      - name: Verify every frozen app still matches its record
        run: |
          [ -f registered.yaml ] || { echo "nothing frozen yet"; exit 0; }
          content_hash() { # keep identical to the definition in the step above
            (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1)
          }
          status=0
          for app in $(yq '.apps | keys | .[]' registered.yaml); do
            expected="$(APP="$app" yq '.apps[strenv(APP)].content_sha256' registered.yaml)"
            if [ ! -d "apps/$app" ]; then result=MISSING
            elif [ "$(content_hash "apps/$app")" != "$expected" ]; then result=CHANGED
            else result=ok
            fi
            printf '%-14s %s\n' "$app" "$result"
            [ "$result" = ok ] || status=1
          done
          exit "$status"

      - name: Open a pull request into the base branch
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$(git status --porcelain apps registered.yaml)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          short="${AFTER:0:8}"
          branch="freeze/${short}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add apps registered.yaml
          git commit -m "Freeze requested apps (from ${short})"
          git push origin "$branch"
          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "Freeze requested apps (from ${short})" \
            --body "Frozen from the request files changed in ${AFTER}. registered.yaml records the repository, commit and a content hash of each snapshot."