name: register

# After a request is merged, this forks the app's repository into the organization, adds the fork
# as a submodule under apps/<owner>-<repo> at the requested commit, records the request in
# registered.yaml, removes the request folder, and opens a pull request with the result.
# The request was already checked by check-registry.yml when its pull request was opened.
# If a run fails (for example GitHub is down), nothing was pushed: use "Re-run jobs".

on:
  push:
    branches: [mpships2]   # change to [main] later
    paths: ["registry/**"]

concurrency:
  group: register-${{ github.ref }}
  cancel-in-progress: false

env:
  ORG: ${{ github.repository_owner }}   # the organization that owns the forks

jobs:
  register:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Register the requested app
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # the request this push added or changed (a pull request has exactly one)
          file=$(git diff --no-renames --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- ':(glob)registry/*/registry.yaml')
          if [ -z "$file" ]; then
            echo "No request in this push."
            exit 0
          fi
          [ "$(echo "$file" | wc -l)" -eq 1 ] || { echo "Expected one request, found: $file"; exit 1; }

          repo=$(yq '.[0].upstream_repo' "$file")
          sha=$(yq '.[0].upstream_commit' "$file")
          owner=$(basename "$(dirname "$repo")")
          rname=$(basename "$repo" .git)
          uid="${owner,,}-${rname,,}"   # identifies the app: the upstream owner and repository
          fork="mpships-app-$uid"

          # 1. fork it, or bring the existing fork up to date
          if gh repo view "$ORG/$fork" > /dev/null 2>&1; then
            gh repo sync "$ORG/$fork" || echo "could not update $ORG/$fork, using what it has"
          else
            gh repo fork "$owner/$rname" --org "$ORG" --fork-name "$fork" --clone=false
            for _ in $(seq 1 30); do   # a fork is created in the background
              gh repo view "$ORG/$fork" > /dev/null 2>&1 && break
              sleep 2
            done
          fi

          # 2. the fork becomes a submodule, at the requested commit
          if git ls-files --error-unmatch -- "apps/$uid" > /dev/null 2>&1; then
            git submodule update --init -- "apps/$uid"
          else
            git submodule add --name "$uid" -- "https://github.com/$ORG/$fork.git" "apps/$uid"
          fi
          git -C "apps/$uid" checkout -q "$sha^{commit}"

          # 3. record the request in registered.yaml: the unique id is the key, the request is the value
          if [ ! -s registered.yaml ] || [ "$(yq 'length' registered.yaml)" -eq 0 ]; then
            echo "{}" > registered.yaml
          fi
          UNIQUE_ID="$uid" REQ="$file" yq -i '.[strenv(UNIQUE_ID)] = (load(strenv(REQ)) | .[0]) | sort_keys(.)' registered.yaml

          # 4. the request is done: remove it, and open a pull request
          git rm -q -r "$(dirname "$file")"
          git add .gitmodules "apps/$uid" registered.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="register/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git commit -m "Register $uid from ${AFTER::7}"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "Register $uid from ${AFTER::7}" \
            --body "Forked into ${ORG}, added as a submodule under apps/${uid}, and recorded in registered.yaml."